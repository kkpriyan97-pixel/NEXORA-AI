name: NEXORA Python validation

on:
  push:
    branches:
      - main
      - upgrade-ai-isolation-learning-v1
  pull_request:
    branches:
      - main

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Import application
        env:
          M1_WORLD_LEARNING_ENABLED: "false"
          LEARNING_PRACTICE_ENABLED: "false"
          AI_EXTERNAL_LIVE_ENABLED: "false"
          AI_EXTERNAL_BACKGROUND_ENABLED: "false"
        run: python -c "import app; print('NEXORA_IMPORT_OK')"
