name: Brain Syntax Check

on:
  push:
    branches:
      - safe-brain-pattern-learning

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile app.py brain_rules.py candice_brain.py ai_router.py ai_engine.py ai_provider.py
