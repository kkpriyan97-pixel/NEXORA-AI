name: NEXORA Render Keepalive

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep Render service awake
        run: |
          curl -fsS --max-time 20 https://priyanithan-zflv.onrender.com/ >/dev/null
