name: NEXORA Render Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep Render service awake
        run: |
          curl --fail --silent --show-error             --retry 5 --retry-all-errors --retry-delay 3             --connect-timeout 10 --max-time 60             https://priyanithan-zflv.onrender.com/health
