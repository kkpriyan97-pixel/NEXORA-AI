name: Production bot checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # GitHub repository policy requires immutable full-length SHA pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run live-brain smoke test
        env:
          M1_WORLD_LEARNING_ENABLED: "false"
          LEARNING_PRACTICE_ENABLED: "false"
          AI_EXTERNAL_LIVE_ENABLED: "false"
          AI_EXTERNAL_BACKGROUND_ENABLED: "false"
        run: python brain_smoke_test.py
